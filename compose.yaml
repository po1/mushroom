services:
  mushroomd:
    build: ./server
    volumes:
      - data:/data
  webproxy:
    build: ./webproxy
    environment:
      MUSHROOMD_HOST: "mushroomd"
      MUSHROOMD_PORT: "1337"
    ports:
      - "1338:1338"
  client:
    image: nginx:1.25.5
    ports:
      - "8000:80"
    volumes:
      - "${PWD}/webproxy/client/index.html:/usr/share/nginx/html/index.html"

volumes:
  data:
