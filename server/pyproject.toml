[project]
name = "mushroom"
dynamic = ["version"]
description = "A new MUSH server"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
        "frozendict>=2.4.7",
        "lark",
        "tomli",
        "websockets",
]
authors = [
    {name = "Paul Mathieu", email = "paul@ponteilla.net"},
]

[project.scripts]
mushroomd = "mushroom.server:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff.lint]
