services:
  mushroomd-dev:
    build:
      target: dev
    user: ${UID}:${GID}
    working_dir: /workspace
    environment:
      HOME: /tmp
      DOCKER_USER: ${USER}
    volumes:
      - data:/data
      - .:/workspace
      - "${HOME}/.gitconfig:/home/coder/.gitconfig"
    ports:
      - "127.0.0.1:9000:8080"
    command: ["--auth=none", "/workspace"]
  webproxy:
    build: ./client
    environment:
      MUSHROOMD_HOST: "mushroomd-dev"
      MUSHROOMD_PORT: "1337"
    ports:
      - "1338:1338"
  client:
    image: nginx:1.25.5
    ports:
      - "8000:80"
    volumes:
      - "${PWD}/client/static/index.html:/usr/share/nginx/html/index.html"
volumes:
  data:
