services:
  mushroomd-dev:
    image: ghcr.io/astral-sh/uv:alpine3.23
    command: sh -c "uv venv -c && uv pip install -e . && while sleep 1; do :; done"
    working_dir: /workspace
    volumes:
      - data:/data
      - ./server:/workspace
  webproxy:
    build: ./client
    environment:
      MUSHROOMD_HOST: "mushroomd-dev"
      MUSHROOMD_PORT: "1337"
    ports:
      - "1338:1338"
  client:
    image: nginx:1.25.5
    ports:
      - "8000:80"
    volumes:
      - "${PWD}/client/static/index.html:/usr/share/nginx/html/index.html"
  code:
    image: codercom/code-server
    volumes:
      - "${PWD}:/home/coder/project"
      - "${HOME}/.gitconfig:/home/coder/.gitconfig"
    user: ${UID}:${GID}
    environment:
      DOCKER_USER: ${USER}
    ports:
      - "127.0.0.1:9000:8080"
    command: ["--auth=none", "project"]

volumes:
  data:
